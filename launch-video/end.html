<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/kit.css">
<style>
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .line1 { font-size: 104px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; }
  .brand { margin-top: 90px; display: flex; align-items: center; gap: 32px; }
  .logo { width: 120px; height: 120px; border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,0.08); }
  .logo img { width: 100%; height: 100%; display: block; }
  .name { font-size: 72px; font-weight: 800; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="stage">
  <div class="glow" id="glow"></div>
  <div class="center">
    <div class="line1" id="a">Deviens l'homme</div>
    <div class="line1 grad" id="b">que tu veux être.</div>
    <div class="brand" id="brand">
      <div class="logo"><img src="assets/logo.svg"></div>
      <div class="name">Better Man <span class="grad">AI</span></div>
    </div>
  </div>
  <div class="veil" id="veil"></div>
</div>
<script type="module">
import { rise, edges, drift, loaded } from './assets/kit.js';
const D = 4.5;
window.film = {
  duration: D,
  ready: loaded(),
  frame(t) {
    rise(document.getElementById('a'), t, 0.2, 1.0, 50);
    rise(document.getElementById('b'), t, 0.5, 1.0, 50);
    rise(document.getElementById('brand'), t, 1.3, 1.0, 30);
    drift(document.getElementById('glow'), t, 960, 540);
    edges(document.getElementById('veil'), t, D, 0.3, 0.8);
  },
};
</script>
</body>
</html>
